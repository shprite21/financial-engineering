name: Market intelligence setup

on:
  push:
    branches: [main]
    paths:
      - '05-Competitive-Market-Intelligence-Dashboard/**'
      - '.github/workflows/market-intelligence-setup.yml'
  pull_request:
    branches: [main]
    paths:
      - '05-Competitive-Market-Intelligence-Dashboard/**'
      - '.github/workflows/market-intelligence-setup.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: 05-Competitive-Market-Intelligence-Dashboard

jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 05-Competitive-Market-Intelligence-Dashboard/requirements.txt
      - name: Create a clean project environment
        run: python run.py --setup-only
      - name: Check installed dashboard dependencies
        run: python run.py --check
      - name: Open dashboard and export examples without credentials
        run: python run.py --setup-only --smoke-test
      - name: Verify setup can be repeated
        run: python run.py --setup-only
      - name: Check Windows entry point
        if: runner.os == 'Windows'
        shell: cmd
        run: start.bat --check
      - name: Check macOS and Linux entry point
        if: runner.os != 'Windows'
        run: bash start.sh --check
